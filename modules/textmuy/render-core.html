<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TextMuy Render Core</title>
    <!--
      Render Core: motor de render HEADLESS del modulo TextMuy.
      CONTRATO PUBLICO con Personalizador PDF (y cualquier consumidor, ver AGENTS.md):
        - Carga solo el motor de render (sin UI): fonts + effects + editor + export + api.
        - Expone window.TextMuyAPI.renderBatch([{id, text, preset|settings, width, height}], {onProgress})
          -> [{id, blob}] y window.RenderCore = {version, ready} cuando todo esta disponible.
        - El <link> de Google Fonts es NECESARIO: el canvas resuelve las familias de
          document.fonts (mismas familias que el editor).
      Para la UI del editor usar index.html, no esta pagina.
    -->
    <link href="https://fonts.googleapis.com/css2?family=Freckle+Dragon&family=Permanent+Marker&family=Rock+Salt&family=Bangers&family=Anton&family=Oswald:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700;800;900&family=Pacifico&family=Press+Start+2P&family=Creepster&family=Share+Tech+Mono&family=Rubik+Wet+Paint&family=Carter+One&family=Fascinate&family=Kanit:wght@400;500;600;700;800;900&family=Bebas+Neue&family=Carter+One&family=Lobster&family=Raleway:wght@400;500;600;700;800;900&family=Open+Sans:wght@400;500;600;700;800&family=Lato:wght@400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700;800;900&family=Merriweather:wght@400;500;600;700;800;900&family=Source+Sans+Pro:wght@400;500;600;700;800;900&family=Nunito:wght@400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800;900&family=Ubuntu:wght@400;500;600;700;800;900&family=Righteous&family=Abril+Fatface&family=Satisfy&family=Dancing+Script:wght@400;500;600;700&family=Indie+Flower&family=Shadows+Into+Light&family=Architects+Daughter&family=Patrick+Hand&family=Kalam:wght@400;500;700&family=Amatic+SC:wght@400;500;600;700&family=Caveat:wght@400;500;600;700&family=Zeyada&family=Great+Vibes&family=Alex+Brush&family=Allura&family=Sacramento&family=Tangerine:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700;800;900&family=Nunito:wght@400;500;600;700;800;900&family=Work+Sans:wght@400;500;600;700;800;900&family=Josefin+Sans:wght@400;500;600;700&family=Quattrocento+Sans:wght@400;500;600;700&family=Crimson+Text:wght@400;500;600;700&family=Libre+Baskerville:wght@400;500;600;700&family=PT+Sans:wght@400;500;600;700&family=Source+Serif+Pro:wght@400;500;600;700&family=Slabo+27px&family=Arimo:wght@400;500;600;700&family=Arvo:wght@400;500;600;700&family=Lora:wght@400;500;600;700&family=Vollkorn:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <script src="js/fonts.js?v=RC2"></script>
    <script src="js/effects/distort-engine.js?v=RC2"></script>
    <script src="js/effects/bevel-webgl.js?v=RC2"></script>
    <script src="js/effects/specular-webgl.js?v=RC2"></script>
    <script src="js/editor.js?v=RC2"></script>
    <!-- preset-manager: necesario para resolver presets .txm (settingsFromDelta). -->
    <script src="js/preset-manager.js?v=RC2"></script>
    <script src="js/export.js?v=RC2"></script>
    <script src="js/api.js?v=RC2"></script>
    <script>
    (function() {
        'use strict';
        // ExportManager necesita la referencia al editor (en la UI lo hace main.js).
        if (window.ExportManager && window.TextEditor) {
            window.ExportManager.init(window.TextEditor);
        }
        window.RenderCore = { version: 1, ready: true };
        // Handshake al parent (same-origin): el consumidor puede sondear window.RenderCore
        // o escuchar este mensaje.
        try {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'render-core-ready', version: 1 }, window.location.origin);
            }
        } catch (_) { /* queda el sondeo */ }
    })();
    </script>
</body>
</html>
